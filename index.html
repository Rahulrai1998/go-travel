<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- external resources -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
      integrity="sha512-XcIsjKMcuVe0Ucj/xgIXQnytNwBttJbNjltBV18IOnru2lDPe9KRRyvCXw6Y5H415vbBLRm8+q6fmLUU7DfO6Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <!-- header -->
    <header class="header" id="header">
      <nav class="nav container">
        <a href="#" class="nav-logo">
          <img src="/img/logo.svg" alt="logo image" />
          <span>GoTravel</span>
        </a>

        <div class="nav-menu" id="nav-menu">
          <ul class="nav-list">
            <li><a href="#home" class="nav-link">Home</a></li>
            <li><a href="#destinations" class="nav-link">Destinations</a></li>
            <li><a href="#testimonials" class="nav-link">Testimonials</a></li>
            <li><a href="#gallery" class="nav-link">Gallery</a></li>
            <li><a href="#contact" class="nav-link">Contact</a></li>
          </ul>

          <!-- close dropdown-navlist button-->
          <div class="nav-close" id="nav-close">
            <i class="ri-close-large-line"></i>
          </div>
        </div>

        <div class="nav-btns">
          <!-- theme button -->
          <i class="ri-moon-fill nav-theme" id="theme-btn"></i>
          <!-- toggle button -->
          <div class="nav-toggle" id="nav-toggle">
            <i class="ri-menu-line"></i>
          </div>
        </div>
      </nav>
    </header>

    <!-- main -->
    <main class="main">
      <section class="home section" id="home">
        <img
          src="img/home-bg.png"
          alt="home background image"
          class="home-bg"
        />
        <div class="home-blur"></div>

        <div class="home-container container grid">
          <div class="home-data">
            <h1 class="home-title">
              Travel <br />
              Around <br />
              The World
            </h1>
            <p class="home-description">
              Explore the best beautiful tourist spots in the countries and see
              the world on all your amazing adventures.
            </p>

            <a href="#destinations" class="btn btn-opa-30"
              >Explore The World<i class="ri-arrow-right-long-fill"></i
            ></a>
          </div>

          <div class="home-swiper swiper">
            <div class="swiper-wrapper">
              <article class="home-article swiper-slide">
                <img
                  src="img/home-img-1.png"
                  alt="swiper image"
                  class="home-img"
                />
              </article>
              <article class="home-article swiper-slide">
                <img
                  src="img/home-img-2.png"
                  alt="swiper image"
                  class="home-img"
                />
              </article>
              <article class="home-article swiper-slide">
                <img
                  src="img/home-img-3.png"
                  alt="swiper image"
                  class="home-img"
                />
              </article>
              <article class="home-article swiper-slide">
                <img
                  src="img/home-img-4.png"
                  alt="swiper image"
                  class="home-img"
                />
              </article>
            </div>
            <div class="swiper-button-prev">
              <i class="ri-arrow-left-long-line"></i>
            </div>
            <div class="swiper-button-next">
              <i class="ri-arrow-right-long-line"></i>
            </div>
          </div>
        </div>
      </section>
      <section class="destinations section" id="destinations"></section>
      <section class="testimonials section" id="testimonials"></section>
      <section class="gallery section" id="gallery"></section>
      <section class="contact section" id="contact"></section>
    </main>

    <!-- footer -->
    <footer class="footer"></footer>
    <!-- scroll-up -->
    <!-- scroll-reveal -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
